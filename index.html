<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6bff">
    <title>딱맞는박스 — 물건 크기로 찾는 택배상자</title>
    <meta name="description" content="넣을 물건의 가로·깊이·높이만 입력하면 그 물건이 들어가는 국내 택배상자를 실구매 금액 순으로 비교해 드립니다.">
    <link rel="stylesheet" href="./assets/css/style.css?v=2">
</head>
<body>

    <header class="app-header">
        <h1 class="app-header__title">딱맞는박스</h1>
        <p class="app-header__sub">넣을 물건 크기만 재면 딱 맞는 택배상자를 찾아드립니다</p>
    </header>

    <main class="app-main">

        <form class="panel" id="search-form" novalidate>

            <!-- 1. 물건 규격 입력 -->
            <fieldset class="field">
                <legend class="field__label">넣을 물건 크기 <span class="field__unit">(mm)</span></legend>
                <div class="dims">
                    <label class="dims__item">
                        <span class="dims__name">가로 W</span>
                        <input type="number" id="input-w" inputmode="numeric" pattern="[0-9]*"
                               min="1" max="2000" step="1" placeholder="0" autocomplete="off">
                    </label>
                    <label class="dims__item">
                        <span class="dims__name">깊이 D</span>
                        <input type="number" id="input-d" inputmode="numeric" pattern="[0-9]*"
                               min="1" max="2000" step="1" placeholder="0" autocomplete="off">
                    </label>
                    <label class="dims__item">
                        <span class="dims__name">높이 H</span>
                        <input type="number" id="input-h" inputmode="numeric" pattern="[0-9]*"
                               min="1" max="2000" step="1" placeholder="0" autocomplete="off">
                    </label>
                </div>
                <p class="guide">물건보다 <b>크거나 같은</b> 상자만 보여드립니다. 물건보다 작은 상자는 제외됩니다.</p>
                <p class="error-msg" id="input-error" role="alert"></p>
            </fieldset>

            <!-- 2. 필요 수량 -->
            <div class="field">
                <label class="field__label" for="input-qty">필요 수량</label>
                <div class="qty">
                    <input type="number" id="input-qty" inputmode="numeric" pattern="[0-9]*"
                           min="1" max="999" step="1" value="1" autocomplete="off">
                    <span class="qty__unit">개</span>
                </div>
                <p class="guide">묶음 단위로만 파는 상품이 많아, 이 수량 기준 <b>실제 지불 금액</b>으로 정렬합니다.</p>
            </div>

            <!-- 3. 여유 허용치 -->
            <div class="field">
                <div class="field__row">
                    <label class="field__label" for="margin-range">허용 여유</label>
                    <output class="field__output" id="margin-value" for="margin-range">30mm</output>
                </div>
                <input type="range" id="margin-range" min="0" max="100" step="5" value="30">
                <p class="guide" id="margin-guide"></p>
            </div>

            <!-- 4. 회전 허용 -->
            <label class="check">
                <input type="checkbox" id="allow-swap" checked>
                <span>가로/깊이를 90° 돌려서 넣는 것도 허용</span>
            </label>

            <button type="button" class="btn-reset" id="reset-btn">입력 초기화</button>
        </form>

        <!-- 5. 결과 -->
        <section class="results" aria-live="polite">
            <div class="results__head">
                <h2 class="results__title">검색 결과</h2>
                <div class="summary" id="summary"></div>
                <button type="button" class="btn-share" id="share-btn" hidden>링크 복사</button>
            </div>
            <div id="results"></div>
        </section>

        <p class="disclaimer">
            규격·가격은 판매처 공개 정보 기준이며 수시로 바뀝니다. 구매 전 판매처 페이지에서 반드시 확인해 주세요.
        </p>

    </main>

    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
